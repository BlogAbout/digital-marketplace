services:
  nginx:
    image: nginx:alpine
    container_name: marketplace-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/public
      - ./storage:/var/www/storage
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - marketplace

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: marketplace
      DB_USERNAME: marketplace
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - postgres
      - redis
    networks:
      - marketplace

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - app
      - redis
    networks:
      - marketplace

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-scheduler
    restart: unless-stopped
    command: sh -c "while [ true ]; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - app
    networks:
      - marketplace

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8081:8080"
    depends_on:
      - redis
      - app
    networks:
      - marketplace

  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - marketplace

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - marketplace

networks:
  marketplace:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
